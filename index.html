<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Standalone shim: AI + downloads via /api/ai, and Supabase sign-in. Not used inside claude.ai. */
(function(){
if(window.claude)return;
const CFG=window.SL_CONFIG||{};
let sb=null;
window.SL_NEEDS_AUTH=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);window.SL_USER=null;window.SL_SHOW_AUTH=(n,m)=>showAuth(n,m);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};

/* ---------- AI ---------- */
async function token(){if(!sb)return"";const r=await sb.auth.getSession();return r.data.session?r.data.session.access_token:""}
async function call(body,retry){
  const h={"Content-Type":"application/json","x-access-code":ls("sl-code")||""},t=await token();
  if(t)h.Authorization="Bearer "+t;
  const r=await fetch("/api/ai",{method:"POST",headers:h,body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){
    if(sb){showAuth("Please sign in to use the AI.");throw new Error("Please sign in to use the AI.")}
    if(!retry){const c=prompt("Enter the access code for this site");if(c){ls("sl-code",c);return call(body,true)}}
  }
  if(!r.ok)throw new Error(j.error||"AI request failed ("+r.status+")");
  return j;
}
async function shrink(f){
  try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return{media_type:"image/jpeg",data:c.toDataURL("image/jpeg",.85).split(",")[1]}}
  catch(e){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({media_type:f.type||"image/jpeg",data:String(r.result).split(",")[1]});r.onerror=rej;r.readAsDataURL(f)})}
}
const sample=async(prompt,o)=>{const images=[];for(const f of(o&&o.images)||[])images.push(await shrink(f));return call({prompt,images})};
sample.json=async p=>{const t=(await sample(p)).text.replace(/```json|```/g,"").trim();try{return JSON.parse(t)}catch(e){const m=t.match(/[\[{][\s\S]*[\]}]/);if(m)return JSON.parse(m[0]);throw e}};
sample.limits=async()=>({images:true});
const types={html:"text/html",json:"application/json",txt:"text/plain",md:"text/markdown"};
const dl={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:types[(filename.split(".").pop()||"").toLowerCase()]||"text/plain"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}};
window.claude={use:async n=>{if(n==="sample")return sample;if(n==="downloads")return dl;throw new Error("not available outside claude.ai")}};

/* ---------- Sign-in (only when /config.js has Supabase keys) ---------- */
const $i=id=>document.getElementById(id);
function msg(t,ok){const m=$i("am");if(m){m.textContent=t||"";m.style.color=ok?"#1f7a5a":"#b3392f"}}
const LPCSS='.lp{min-height:100%;background:var(--bg,#f6f5f1);color:var(--ink,#1d2320);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.lp-stripe{height:8px;background:linear-gradient(90deg,#ce1126 0 33.3%,#fcd116 33.3% 66.6%,#006b3f 66.6%)}.lp-h{max-width:960px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.lp-logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}.lp-logo i{font-style:normal;color:#1f7a5a}.lp-hero{max-width:720px;margin:0 auto;padding:34px 18px 18px;text-align:center}.lp-tag{display:inline-block;background:#fff6c9;color:#6b5600;border:1px solid #f0dc7a;border-radius:99px;padding:4px 12px;font-size:13px}.lp-hero h1{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:16px 0 12px}.lp-hero p{font-size:17px;color:var(--mut,#66706a);margin:0 auto 22px;max-width:560px}.lp-cta{padding:14px 26px;font-size:17px}.lp-note{margin-top:10px;font-size:13px;color:var(--mut,#66706a)}.lp-cards{max-width:960px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.lp-cards .card{margin:0}.lp-cards h3{margin:0 0 6px}.lp-f{text-align:center;padding:22px 18px 40px;color:var(--mut,#66706a);font-size:14px}.lp-mod{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.lp-card{width:100%;max-width:380px;margin:0!important;position:relative}.lp-x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:20px;cursor:pointer;color:inherit}.lp-in{display:block;width:100%;box-sizing:border-box;margin-bottom:8px}.lp-sw{text-align:center;margin:12px 0 0}@media (prefers-color-scheme:dark){.lp-tag{background:#3a3310;color:#f6e27a;border-color:#6b5c18}}';
const LOGO='<svg width="34" height="34" viewBox="0 0 48 48" role="img" aria-label="StudyLoop logo"><rect width="48" height="48" rx="12" fill="#1f7a5a"/><path d="M34 17a11 11 0 1 0 2 9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M34 9v8h-8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 25l4 4 7-8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let AUL=null;
const LVNAME={JHS:"Junior High (BECE)",SHS:"Senior High (WASSCE)",UNI:"University"};
let AUD=false;const AUP={form:"",weak:"",fav:""};
const FORMS={JHS:["JHS 1","JHS 2","JHS 3"],SHS:["SHS 1","SHS 2","SHS 3"]};
const SUBJS={JHS:["English Language","Mathematics","Integrated Science","Social Studies","Religious and Moral Education","Computing (ICT)","French","Ghanaian Language","Career Technology","Creative Arts and Design"],
SHS:["English Language","Core Mathematics","Integrated Science","Social Studies","Elective Mathematics","Physics","Chemistry","Biology","Economics","Geography","Government","History","Literature in English","Accounting","Business Management","Elective ICT","Other"]};
function fillAbout(){
  const opt=(arr,first)=>'<option value="">'+first+'</option>'+arr.map(x=>'<option>'+x+'</option>').join("");
  const sj=SUBJS[AUL]||[];
  $i("afm").innerHTML=opt(FORMS[AUL]||[],"Choose your form");
  $i("awk").innerHTML=opt(sj.concat(["Not sure yet"]),"Choose a subject");
  $i("afv").innerHTML=opt(sj.concat(["Not sure yet"]),"Choose a subject");
}
function lvStep(){
  const mode=$i("a1").dataset.mode,up=mode==="up",pick=up&&!AUL,school=AUL==="JHS"||AUL==="SHS",about=up&&!pick&&school&&!AUD,acc=up&&!pick&&!about;
  $i("alv").style.display=pick?"block":"none";
  $i("aab").style.display=about?"block":"none";
  $i("alc").style.display=(up&&!pick)?"block":"none";if(AUL)$i("alt").textContent=LVNAME[AUL]+(AUD&&AUP.form?" \u00b7 "+AUP.form:"");
  $i("an").style.display=acc?"block":"none";
  $i("apm").style.display=(acc&&school)?"":"none";$i("apn").style.display=(acc&&school)?"":"none";
  $i("acl").style.display=acc?"block":"none";
  if(acc){$i("acx").innerHTML=school?'I have read the <a href="#" id="apv">Privacy Notice</a>, and a parent or guardian knows I am signing up.':'I have read the <a href="#" id="apv">Privacy Notice</a>.';const pv=$i("apv");if(pv)pv.onclick=e=>{e.preventDefault();showPrivacy()}}
  ["ae","ap","a1"].forEach(i=>{$i(i).style.display=(pick||about)?"none":""});
  if(mode!=="reset")$i("a-t").textContent=up?(pick?"What are you studying for?":about?"Tell us about you":"Create your account"):"Welcome back";
}
function setMode(m){
  const up=m==="up";
  $i("ae").style.display="";$i("a-sw").style.display="";$i("apm").style.display="none";$i("apn").style.display="none";$i("aab").style.display="none";$i("acl").style.display="none";
  $i("a-t").textContent=up?"Create your account":"Welcome back";
  $i("an").style.display=up?"block":"none";
  $i("a1").textContent=up?"Create account":"Sign in";
  $i("a-sw").textContent=up?"Already have an account? Sign in":"New here? Create an account";
  $i("a3").style.display=up?"none":"inline";
  $i("ap").autocomplete=up?"new-password":"current-password";
  $i("a1").dataset.mode=m;msg("");
  if(m==="reset"){$i("a-t").textContent="Set a new password";$i("an").style.display="none";$i("ae").style.display="none";$i("a1").textContent="Save password";$i("a-sw").style.display="none";$i("a3").style.display="none";$i("ap").autocomplete="new-password";$i("alv").style.display="none";$i("alc").style.display="none";$i("aab").style.display="none";$i("acl").style.display="none";return}
  lvStep();
}
function openBox(m){$i("lp-mod").style.display="flex";setMode(m);setTimeout(()=>{const f=$i(m==="up"?"an":"ae");if(f)f.focus()},50)}
function closeBox(){const b=$i("lp-mod");if(b)b.style.display="none";if($i("land"))hideAuth()}
function showAuth(note,mode){
  let o=$i("auth");
  if(!o){
    const st=document.createElement("style");st.textContent=LPCSS;document.head.appendChild(st);
    o=document.createElement("div");o.id="auth";
    o.style.cssText="position:fixed;inset:0;z-index:100;overflow:auto;background:var(--bg,#f6f5f1)";
    o.innerHTML='<div class="lp"><div class="lp-stripe"></div><header class="lp-h"><span class="lp-logo">'+LOGO+'<span>Study<i>Loop</i></span></span><button id="l-in">Sign in</button></header>'
    +'<section class="lp-hero"><span class="lp-tag">Akwaaba! Made in Ghana \ud83c\uddec\ud83c\udded</span><h1>Pass your BECE, WASSCE and university exams with confidence</h1><p>Practise with questions built for Ghanaian students, learn with Shark, your study buddy, and see exactly what to revise next.</p><button id="l-up" class="p lp-cta">Get started free</button><div class="lp-note">Free to start. No card needed.</div></section>'
    +'<section class="lp-cards"><div class="card"><h3>Built for Ghana</h3><div class="mut">BECE and WASSCE subjects like Integrated Science, Core Maths, English and Social Studies, in the WAEC style.</div></div><div class="card"><h3>Meet Shark</h3><div class="mut">A friendly AI study buddy that explains tough topics using your own notes.</div></div><div class="card"><h3>Know what to revise</h3><div class="mut">See your weak topics and get a clear next step every time you study.</div></div></section>'
    +'<footer class="lp-f">StudyLoop \u00b7 Made with pride in Ghana</footer>'
    +'<div id="lp-mod" class="lp-mod"><div class="card lp-card"><button id="a-x" class="lp-x" aria-label="Close">\u2715</button><h2 id="a-t" style="margin:0 0 8px">Welcome back</h2><div id="am" style="min-height:20px;margin-bottom:6px;font-size:14px"></div>'
    +'<div id="alv" style="display:none"><p class="mut" style="margin:0 0 6px">Step 1 of 2. StudyLoop sets itself up for your level.</p><button class="p" data-lv="JHS" style="display:block;width:100%;margin:8px 0;padding:14px;text-align:left">Junior High School<br><small>Preparing for the BECE</small></button><button class="p" data-lv="SHS" style="display:block;width:100%;margin:8px 0;padding:14px;text-align:left">Senior High School<br><small>Preparing for the WASSCE</small></button><button class="p" data-lv="UNI" style="display:block;width:100%;margin:8px 0;padding:14px;text-align:left">University<br><small>Lectures and semester exams</small></button></div><p id="alc" class="mut" style="display:none;margin:0 0 8px">Step 2 of 2 &middot; <b id="alt"></b> &middot; <a id="achg" href="#">Change</a></p>'
    +'<div id="aab" style="display:none"><label class="mut" for="afm">Which form are you in?</label><select id="afm" class="lp-in"></select><label class="mut" for="awk">Which subject do you find hardest?</label><select id="awk" class="lp-in"></select><label class="mut" for="afv">Which subject do you enjoy most?</label><select id="afv" class="lp-in"></select><button id="a-ab" class="p" style="width:100%;margin-top:10px">Continue</button></div>'
    +'<input id="an" class="lp-in" type="text" placeholder="Your full name" autocomplete="name"><input id="ae" class="lp-in" type="email" placeholder="Email" autocomplete="email"><input id="ap" class="lp-in" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><input id="apm" class="lp-in" type="email" placeholder="Parent or guardian email" autocomplete="off" style="display:none"><p id="apn" class="mut" style="display:none;margin:4px 0 8px;font-size:13px">So a parent or guardian can follow your progress. We will tell you before we contact them, and they can ask us to remove it. You can change it later from the menu.</p>'
    +'<p id="acl" class="mut" style="display:none;margin:6px 0 8px;font-size:13px"><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="acc" style="width:auto;margin-top:3px"><span id="acx"></span></label></p>'
    +'<button id="a1" class="p" style="width:100%;margin-top:4px">Sign in</button><p class="lp-sw"><a id="a-sw" href="#">New here? Create an account</a></p><p class="lp-sw" style="margin-top:6px"><a id="a3" href="#">Forgot password?</a></p><p style="text-align:center;margin:8px 0 0"><a id="a4" href="#">Back to home</a></p></div></div></div>';
    document.body.appendChild(o);
    if($i("land")){o.style.background="rgba(8,24,17,.55)";o.querySelectorAll(".lp-stripe,.lp-h,.lp-hero,.lp-cards,.lp-f").forEach(e=>{e.style.display="none"})}
    const N=()=>$i("an").value.trim(),E=()=>$i("ae").value.trim(),P=()=>$i("ap").value;
    $i("l-in").onclick=()=>openBox("in");$i("l-up").onclick=()=>openBox("up");$i("a-x").onclick=closeBox;
    $i("lp-mod").onclick=e=>{if(e.target.id==="lp-mod")closeBox()};
    $i("a-sw").onclick=e=>{e.preventDefault();setMode($i("a1").dataset.mode==="up"?"in":"up")};
    const go=async()=>{
      msg("");
      if($i("a1").dataset.mode==="reset"){if(P().length<8)return msg("Use a password of at least 8 characters.");const r=await sb.auth.updateUser({password:P()});if(r.error)return msg(r.error.message);msg("Password saved. You are signed in.",true);setTimeout(closeBox,900);return}

      if(needP){if(!PM())return msg("Please enter a parent or guardian email.");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(PM()))return msg("That parent email does not look right.");if(PM().toLowerCase()===E().toLowerCase())return msg("Use your parent or guardian email, not your own.")}

async function startSync(uid){
  SY.uid=uid;SY.ready=false;dot('#c98a00','syncing');
  try{
    const r=await sb.from('user_sems').select('sem_id,data,u,deleted').eq('user_id',uid);
    if(r.error)throw r.error;
    let local;try{local=JSON.parse(ls('sl1')||'{}')}catch(e){local={}}
    local.sems=local.sems||[];
    const L={};local.sems.forEach(s=>{L[s.id]=s});let changed=false,meta=null;
    (r.data||[]).forEach(row=>{
      const id=row.sem_id;
      if(id==='_meta'){meta=row.data||{};SY.known._meta=metaOf(meta);return}
      if(row.deleted){SY.known[id]='DEL';if(L[id]&&(L[id].u||0)<=row.u){delete L[id];changed=true}return}
      const d=row.data;if(!d)return;SY.known[id]=sig(d);

    });

      if(!local.level&&meta.level){local.level=meta.level;changed=true}
      if(!local.plan&&meta.plan){local.plan=meta.plan;changed=true}

      if(days.length!==(local.days||[]).length){local.days=days;changed=true}

    let S;try{S=JSON.parse(ls('sl1')||'{}')}catch(e){return}

    (S.sems||[]).forEach(s=>{ids.add(s.id);const g=sig(s);if(SY.known[s.id]!==g)rows.push({g,row:{user_id:SY.uid,sem_id:s.id,data:s,u:s.u||0,deleted:false,updated_at:now}})});

    Object.keys(SY.known).forEach(id=>{if(id!=='_meta'&&SY.known[id]!=='DEL'&&!ids.has(id))rows.push({g:'DEL',row:{user_id:SY.uid,sem_id:id,data:null,u:Date.now(),deleted:true,updated_at:now}})});

function rate(ok){const c=dueCards(sem())[0];c.box=ok?Math.min(4,(c.box||0)+1):0;c.due=ok?Date.now()+INT[c.box]*864e5:Date.now()+6e5;fcFlip=false;save();render()}
async function newWritten(kind){const s=sem();if(!s.notes.length){err="Add some lecture notes first.";return render()}busy="Writing a question…";err="";render();
try{const src=s.notes.map(n=>n.title+": "+n.kp.join("; ")).join("\n").slice(0,12000);
const r=await ai(`Write one ${kind==="essay"?"essay question (answerable in 300-500 words)":"short-answer question (2-4 sentences)"} testing understanding of this course material.\nReturn JSON: {"q":"...","topic":"short topic","rubric":["3-5 points a strong answer must cover"]}\nMATERIAL:\n${src}`);
wr={kind,q:r.q,topic:r.topic||"General",rubric:r.rubric||[],a:"",res:null}}catch(e){err=e.message}busy="";render()}
async function markWritten(){const a=$("#wa").value.trim();if(a.length<10){err="Write an answer first.";return render()}wr.a=a;busy="Marking your answer…";err="";render();
try{const r=await ai(`Mark this student answer fairly out of ${wr.marks||10}.\nQuestion: ${wr.q}\nRubric: ${wr.rubric.join("; ")}\nAnswer: ${a}\nReturn JSON: {"score":0-${wr.marks||10},"feedback":"2-3 sentences","missing":["points missed"],"model":"concise model answer"}`);
const M=wr.marks||10;r.score=Math.max(0,Math.min(M,Number(r.score)||0));const g=r.score/M>=.6;wr.res=r;sem().results.push({date:Date.now(),kind:"written",score:Math.round(r.score),total:M,weak:g?[]:[wr.topic],tp:{[wr.topic]:[g?1:0,1]}});save();boardAdd(Math.round(r.score/M*10))}catch(e){err=e.message}busy="";render()}
function writtenView(s){if(!wr)return`<div class="card"><h3>Written practice</h3><p>Answer in your own words and get AI marking against a rubric.</p><div class="row"><button class="p" onclick="newWritten('short')">Short answer</button><button class="p" onclick="newWritten('essay')">Essay question</button></div></div>`;
const r=wr.res;return`<div class="card"><span class="tag">${wr.marks?wr.marks+" marks":wr.kind}</span><h3 style="font-size:18px">${esc(wr.q)}</h3><textarea id="wa" ${r?"readonly":""} style="min-height:${wr.kind==="essay"?220:110}px">${esc(wr.a)}</textarea>${r?`<h2>Score: ${Math.round(r.score)}/${wr.marks||10}</h2><p>${esc(r.feedback)}</p>${(r.missing||[]).length?`<b>Missed:</b><ul>${r.missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:""}<b>Model answer</b><p>${esc(r.model)}</p><button class="p" onclick="nextWr()">${wr.pp?"Next question":"Another question"}</button>`:`<div style="margin-top:8px"><button class="p" onclick="markWritten()">Submit for marking</button></div>`}</div>`}
function planView(s){const d=s.exam?Math.ceil((new Date(s.exam+"T00:00")-new Date().setHours(0,0,0,0))/864e5):null;
let h=`<div class="card"><h3>Exam date</h3><input type="date" value="${esc(s.exam||"")}" onchange="sem().exam=this.value;save();render()" style="max-width:200px">`;
if(d==null)return h+`<p class="mut">Set your exam date to get a day-by-day revision plan.</p></div>`;
if(d<0)return h+`<p>That date has passed.</p></div>`;
h+=`<h2 style="margin:12px 0 0">${d} day${d===1?"":"s"} to go</h2><p class="mut">${dueCards(s).length} flashcards due today · ${s.notes.length} lectures</p></div>`;
if(!s.notes.length)return h;
const n=s.notes.length,D=Math.max(d,1),ph=Math.max(1,Math.floor(D*.6)),days=Math.min(D,21),wk=weakTopics(s)[0];let rows="";
for(let i=0;i<days;i++){const dt=new Date(Date.now()+i*864e5).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});let t;
if(i===D-1)t="Final mock exam, then rest.";
else if(i<ph){const l=s.notes.filter((_,k)=>Math.floor(k*ph/n)===i).map(x=>x.title);t=l.length?"Study: "+l.join(", ")+" · then quiz yourself":"Catch-up day: re-read your weak spots"}
else t="Revise "+s.notes[(i-ph)%n].title+" · flashcards · "+(wk?"weak topic: "+wk[0]:"mixed quiz");
rows+=`<div class="card" style="margin:6px 0"><b style="font-family:system-ui">${dt}</b> <span class="mut">${i===0?"(today)":""}</span><div>${esc(t)}</div></div>`}
return h+rows+(D>21?`<p class="mut">Showing the next 21 days.</p>`:"")}
async function loadBoard(){board=null;gmsg="";const s=sem();render();liveSubscribe();if(!db||!s||!s.group)return;
try{const q=await db.collection("board").get(),rows=[];(q.docs||[]).forEach(d=>{const v=(d.data().codes||{})[s.group];if(v)rows.push({id:d.id,pts:v.pts,tests:v.tests})});rows.sort((a,b)=>b.pts-a.pts);
const ps=usr?await usr.profiles(rows.map(r=>r.id)):{};rows.forEach(r=>r.name=(ps[r.id]&&ps[r.id].name)||"Student");board=rows}catch(e){gmsg="Could not load the leaderboard."}render()}
async function boardAdd(p){const s=sem();if(!db||!s.group)return;try{const ref=db.collection("board").doc(uidv),sn=await ref.get(),c=(sn.exists?sn.data().codes:null)||{},v=c[s.group]||{pts:0,tests:0};await ref.set({codes:{...c,[s.group]:{pts:v.pts+p,tests:v.tests+1}}})}catch(e){}}
function joinGroup(){const c=$("#gc").value.trim().toUpperCase().replace(/\W/g,"");if(c.length<3){gmsg="Use a code of 3+ letters or numbers.";return render()}sem().group=c;save();loadBoard()}
async function shareSem(){const s=sem();try{await db.collection("shared").doc(s.group).set({name:s.name,notes:s.notes.map(n=>({title:n.title,kp:n.kp,topics:n.topics}))});gmsg="Shared. Classmates with this code can import it."}catch(e){gmsg="Could not share (too large or no permission)."}render()}
async function importSem(){const s=sem();try{const sn=await db.collection("shared").doc(s.group).get();if(!sn.exists){gmsg="Nothing shared under this code yet.";return render()}let k=0;(sn.data().notes||[]).forEach(n=>{if(s.notes.some(x=>x.title===n.title))return;s.notes.push({id:uid(),title:n.title,text:n.kp.join("\n"),kp:n.kp,hl:[],topics:n.topics,date:Date.now()});k++});save();gmsg="Imported "+k+" shared lectures."}catch(e){gmsg="Could not import."}render()}
function groupView(s){if(!db)return`<div class="card">Groups and cloud sync need you signed in to claude.ai. Open this page there.</div>`;
let h=`<div class="card"><h3>Study group</h3><p class="mut">Pick a code and share it with classmates. Points: 10 per correct quiz answer, plus written marks.</p><div class="row"><input id="gc" value="${esc(s.group||"")}" placeholder="Group code e.g. BIO101" style="max-width:220px"><button class="p" onclick="joinGroup()">${s.group?"Switch":"Join"}</button></div></div>`;
if(gmsg)h+=`<div class="card">${esc(gmsg)}</div>`;if(!s.group)return h;h+=liveView(s);
h+=`<div class="card row"><button onclick="shareSem()">Share my notes summary</button><button onclick="importSem()">Import shared notes</button></div><div class="card"><h3>Leaderboard · ${esc(s.group)}</h3>`;
h+=board?(board.length?board.map((r,i)=>`<div class="row" style="justify-content:space-between"><span>${i+1}. ${esc(r.name)}</span><b>${r.pts} pts · ${r.tests} tests</b></div>`).join(""):"No scores yet."):"Loading…";
return h+"</div>"}
render();
</script></body></html>
